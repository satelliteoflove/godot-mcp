name: Docs live integration

# The godot_docs live suite hits docs.godotengine.org. It is gated OFF in normal
# CI (it flakes on rate-limiting / slow network), so it runs here instead — as a
# daily canary that catches the real signal: the docs site changing its HTML or
# URL scheme. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:

jobs:
  docs-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      # RUN_LIVE_DOCS opts the gated suites in; --retry absorbs a transient 429
      # so a single rate-limit blip is not reported as a docs-site regression.
      - run: npx vitest run --retry=2 src/__tests__/tools/docs.test.ts
        working-directory: server
        env:
          RUN_LIVE_DOCS: '1'
